<style>
:root{--bg:#0c1226;--bg2:#1b1410;--card:#241a14;--line:#3a2a1e;--amber:#ffb020;--cream:#fff3dc;--mut:#c9b79a;--blue:#3b82f6;--red:#ef4444;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1d2a5a55,transparent),linear-gradient(#0c1226,#17100c);color:var(--cream);font:16px/1.55 Fredoka,"Noto Sans Malayalam",system-ui,sans-serif;min-height:100vh}
a{color:var(--amber)}img,video{max-width:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0c1226e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0c1226;z-index:30}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:1100px;margin:auto}
.brand{font-weight:700;font-size:1.25rem;color:var(--cream);text-decoration:none;text-shadow:0 0 14px #ffb02088}
.air{background:#c01818;color:#fff;font-size:.7rem;font-weight:700;letter-spacing:.1em;padding:3px 9px;border-radius:6px;box-shadow:0 0 10px #ff2a2a,0 0 24px #ff2a2a88;animation:glow 1.6s infinite alternate}
@keyframes glow{to{box-shadow:0 0 4px #ff2a2a66,0 0 10px #ff2a2a44;opacity:.8}}
.sp{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;max-width:1100px;margin:auto;scrollbar-width:none}
nav a{white-space:nowrap;text-decoration:none;color:var(--mut);padding:6px 14px;border-radius:99px;border:1px solid var(--line);font-size:.9rem;transition:.2s}
nav a.on,nav a:hover{color:#1a1006;background:var(--amber);border-color:var(--amber);box-shadow:0 0 14px #ffb02077}
.btn{font:inherit;cursor:pointer;border:0;border-radius:99px;padding:9px 18px;background:var(--amber);color:#1a1006;font-weight:600;text-decoration:none;display:inline-block;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 18px #ffb02099}.btn:active{transform:scale(.96)}
.btn.g{background:transparent;color:var(--cream);border:1px solid var(--line)}.btn.s{padding:5px 12px;font-size:.85rem}.btn.d{background:#7f1d1d;color:#fff}
.btn.yt{background:#e11d2a;color:#fff}.btn.ig{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);color:#fff}.btn.tt{background:#0f0f0f;color:#fff;border:1px solid #25f4ee}
main{max-width:1100px;margin:auto;padding:14px 14px 50px;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}h2{font-size:1.5rem;margin-top:1.6em;color:var(--amber);text-shadow:0 0 16px #ffb02055}
.hero{border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 0 40px #ffb02033}.hero img{display:block;width:100%;height:auto}
.hero+.row{margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}.c{justify-content:center;text-align:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:linear-gradient(160deg,var(--card),#1a1220);border:1px solid var(--line);border-radius:18px;padding:16px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--amber)}
.ico{font-size:1.8rem}.mut{color:var(--mut);font-size:.9rem}
.host{text-align:center;border-width:2px}.host img{width:100%;border-radius:14px;display:block;margin-bottom:10px}
.host.m{border-color:var(--blue);box-shadow:0 0 24px #3b82f644}.host.t{border-color:var(--red);box-shadow:0 0 24px #ef444444}
.host.m h3{color:#7db0ff}.host.t h3{color:#ff8a8a}
.chip{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:99px;padding:4px 13px;font-size:.85rem}.chip.on{background:var(--amber);color:#1a1006;border-color:var(--amber)}
.empty{text-align:center;padding:34px 14px;border:2px dashed var(--line);border-radius:18px;color:var(--mut)}.empty b{display:block;font-size:2rem}
input,textarea,select{width:100%;font:inherit;color:var(--cream);background:#120d0a;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 10px}
input:focus,textarea:focus,select:focus,[contenteditable]:focus{outline:2px solid var(--amber)}
label{font-size:.85rem;color:var(--mut)}
.ed{min-height:140px;background:#120d0a;border:1px solid var(--line);border-radius:12px;padding:10px;margin:4px 0 10px}
.tb{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:.72rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.st-pending{color:var(--amber)}.st-approved{color:#4ade80}.st-rejected{color:#f87171}
.offer{border:1px solid var(--amber);background:#ffb02012;border-radius:14px;padding:12px;margin-top:10px}
.emb{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;margin-top:8px;background:#000}
.lb{position:fixed;inset:0;background:#000d;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out;animation:in .2s}.lb img,.lb video{max-height:85vh;border-radius:12px}
#toasts{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.toast{background:var(--amber);color:#1a1006;padding:9px 18px;border-radius:99px;font-weight:600;animation:in .25s;box-shadow:0 6px 24px #0008}.toast.e{background:#dc2626;color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.drop{border:2px dashed var(--amber);border-radius:16px;padding:24px;text-align:center;color:var(--mut)}.drop.over{background:#ffb02022}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--amber)}
.note{font-size:.8rem;color:var(--mut);border-left:3px solid var(--amber);padding-left:10px;margin:14px 0}
footer{border-top:1px solid var(--line);padding:22px 14px calc(22px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mut);font-size:.9rem}
.wob{animation:wob .5s}@keyframes wob{25%{transform:rotate(-6deg) scale(1.05)}75%{transform:rotate(6deg) scale(1.05)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.walker{position:fixed;left:0;right:0;bottom:calc(4px + env(safe-area-inset-bottom,0px));height:44px;pointer-events:none;z-index:15;overflow:hidden}
.cat{position:absolute;bottom:0;font-size:34px;line-height:1;cursor:pointer;pointer-events:auto;animation:walk 26s linear infinite;filter:drop-shadow(0 0 8px #ffb02088)}
.cat span{display:block;animation:bob .35s ease-in-out infinite alternate}
@keyframes walk{0%{left:-50px;transform:scaleX(-1)}49.9%{left:calc(100% + 10px);transform:scaleX(-1)}50%{left:calc(100% + 10px);transform:scaleX(1)}100%{left:-50px;transform:scaleX(1)}}
@keyframes bob{to{transform:translateY(-5px) rotate(-4deg)}}
.paw{position:fixed;z-index:70;pointer-events:none;font-size:22px;animation:pf .9s ease-out forwards}
@keyframes pf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:16px}.eq i{width:3px;background:var(--amber);border-radius:2px;animation:eq .8s ease-in-out infinite alternate;box-shadow:0 0 6px var(--amber)}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{from{height:3px}to{height:16px}}
.rv{opacity:0;transform:translateY(18px);transition:opacity .5s,transform .5s,border-color .2s}.rv.in{opacity:1;transform:none}.rv.in:hover{transform:translateY(-3px)}
.hero img{animation:zoom 14s ease-in-out infinite alternate}@keyframes zoom{to{transform:scale(1.04)}}
.peek{position:fixed;right:0;top:58%;width:24px;height:40px;overflow:hidden;z-index:14;pointer-events:none;animation:peek 10s ease-in-out infinite}.peek span{display:block;font-size:42px;line-height:40px;animation:blink 3s infinite;transform-origin:center}
@keyframes peek{0%,55%,100%{transform:translateX(100%)}65%,88%{transform:translateX(0)}}@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.host img.wob{transform-origin:50% 100%;animation:talk 1s ease-in-out}@keyframes talk{0%,100%{transform:rotate(0)}15%{transform:rotate(-3deg) scale(1.03)}35%{transform:rotate(3deg) scale(1.05)}55%{transform:rotate(-2deg) scale(1.03)}75%{transform:rotate(2deg) scale(1.02)}}
.btn:not(.s){position:relative}.btn:not(.s)::after{content:"";position:absolute;right:-9px;bottom:5px;width:14px;height:22px;border-right:4px solid var(--tc,var(--amber));border-radius:0 100% 0 0;transform-origin:0 100%;pointer-events:none}
.btn:not(.s):hover::after,.btn:not(.s):active::after{animation:wagt .45s ease-in-out infinite alternate}@keyframes wagt{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
.btn.yt{--tc:#e11d2a}.btn.ig{--tc:#dd2a7b}.btn.tt{--tc:#25f4ee}.btn.g{--tc:#6b4a30}.btn.d{--tc:#7f1d1d}.host.t .btn{--tc:#ef4444}
.mq{overflow:hidden;margin:14px 0;border:1px solid var(--line);border-radius:99px;background:#ffb02010;padding:8px 0}.mq div{display:flex;width:max-content;animation:mq 30s linear infinite}.mq span{white-space:nowrap;color:var(--amber);margin-right:44px}@keyframes mq{to{transform:translateX(-50%)}}
</style></head>

function chirp(){const a=ctx(),n=a.currentTime;[0,.14].forEach((d,i)=>{const o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.setValueAtTime(700+i*150,n+d);o.frequency.exponentialRampToValueAtTime(1500+i*200,n+d+.1);g.gain.setValueAtTime(0,n+d);g.gain.linearRampToValueAtTime(.25,n+d+.02);g.gain.exponentialRampToValueAtTime(.001,n+d+.12);o.connect(g).connect(a.destination);o.start(n+d);o.stop(n+d+.14)})}
